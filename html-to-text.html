<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online HTML to Text Converter | ToolBox Pro</title>
    <meta name="description" content="Free online HTML to text converter. Strip HTML tags and extract clean text from HTML. No login required.">
    <link rel="canonical" href="https://toolboxpro.dev/html-to-text">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-toolbox"></i></div>
                <span class="logo-text">ToolBox</span>
                <span class="logo-badge">PRO</span>
            </a>
            <nav>
                <a href="index.html">Tools</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy</a>
            </nav>
        </div>
    </header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-file-alt" style="color:var(--accent-1)"></i> HTML to Text</h1>
        <p class="tool-description">Strip HTML tags and extract clean, readable text from HTML code. Supports entities and common formatting.</p>

        <div class="tool-input-group">
            <label>Paste your HTML</label>
            <textarea class="tool-textarea" id="html-input" placeholder="<h1>Hello</h1><p>This is <strong>bold</strong> text.</p>"></textarea>
        </div>

        <div class="tool-input-group">
            <label>Options</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="opt-newlines" checked>
                    <span class="check"></span>
                    Add line breaks
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="opt-entities" checked>
                    <span class="check"></span>
                    Decode entities
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="opt-trim" checked>
                    <span class="check"></span>
                    Trim whitespace
                </label>
            </div>
        </div>

        <div class="btn-group">
            <button class="tool-btn btn-primary" onclick="convertHtmlToText()"><i class="fas fa-exchange-alt"></i> Convert</button>
            <button class="tool-btn btn-secondary" onclick="copyElement('html-output')"><i class="fas fa-copy"></i> Copy</button>
            <button class="tool-btn btn-danger" onclick="document.getElementById('html-input').value='';document.getElementById('html-output').textContent=''"><i class="fas fa-trash"></i> Clear</button>
        </div>

        <div class="tool-input-group" style="margin-top:1rem;">
            <label>Output</label>
            <div class="tool-output" id="html-output"></div>
        </div>

        <div class="stats-row" style="margin-top:1rem;">
            <div class="stat-box"><div class="value" id="html-chars">0</div><div class="label">Input Characters</div></div>
            <div class="stat-box"><div class="value" id="text-chars">0</div><div class="label">Output Characters</div></div>
            <div class="stat-box"><div class="value" id="tags-removed">0</div><div class="label">Tags Removed</div></div>
        </div>
    </div>

    <footer>
        <div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;">
            <p>© 2025 ToolBox Pro. All rights reserved.</p>
        </div>
    </footer>

    <script src="components.js"></script>
    <script>
        function convertHtmlToText() {
            const html = document.getElementById('html-input').value;
            if (!html.trim()) { document.getElementById('html-output').textContent = '❌ Please paste some HTML.'; return; }

            const addNewlines = document.getElementById('opt-newlines').checked;
            const decodeEntities = document.getElementById('opt-entities').checked;
            const trimOutput = document.getElementById('opt-trim').checked;

            // Count tags
            const tagCount = (html.match(/<[^>]+>/g) || []).length;

            let text = html;

            if (addNewlines) {
                // Add line breaks around block elements
                text = text.replace(/<\/(div|p|h[1-6]|li|tr|br|hr|blockquote|pre|section|article|header|footer|main|nav)>/gi, '\n');
                text = text.replace(/<br\s*\/?>/gi, '\n');
            }

            // Remove script and style content
            text = text.replace(/<script[\s\S]*?<\/script>/gi, '');
            text = text.replace(/<style[\s\S]*?<\/style>/gi, '');

            // Remove all HTML tags
            text = text.replace(/<[^>]+>/g, ' ');

            if (decodeEntities) {
                const textarea = document.createElement('textarea');
                textarea.innerHTML = text;
                text = textarea.value;
            }

            if (trimOutput) {
                text = text.replace(/[ \t]+/g, ' ').replace(/\n\s*\n/g, '\n').trim();
            }

            document.getElementById('html-output').textContent = text;
            document.getElementById('html-chars').textContent = html.length;
            document.getElementById('text-chars').textContent = text.length;
            document.getElementById('tags-removed').textContent = tagCount;
        }
    </script>
</body>
</html>
