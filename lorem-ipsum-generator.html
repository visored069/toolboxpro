<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Lorem Ipsum Generator | ToolBox Pro</title>
    <meta name="description" content="Free online Lorem Ipsum generator. Generate placeholder text for your designs and mockups.">
    <link rel="canonical" href="https://toolboxpro.dev/lorem-ipsum-generator">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    <header><div class="header-content"><a href="index.html" class="logo"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a><nav><a href="index.html" id="nav-tools">Tools</a><a href="about.html" id="nav-about">About</a><a href="contact.html" id="nav-contact">Contact</a><a href="privacy.html" id="nav-privacy">Privacy</a></nav></div></header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-paragraph" style="color:var(--accent-1)"></i> Lorem Ipsum Generator</h1>
        <p class="tool-description">Generate placeholder text for your designs, mockups, and layouts.</p>

        <div class="tool-input-group">
            <label>Number of paragraphs</label>
            <div class="range-group">
                <input type="range" id="lorem-count" min="1" max="20" value="3" oninput="document.getElementById('lorem-count-val').textContent=this.value">
                <span class="range-value" id="lorem-count-val">3</span>
            </div>
        </div>
        <button class="tool-btn btn-primary" onclick="generateLorem()"><i class="fas fa-magic"></i> Generate</button>
        <div class="tool-output" id="lorem-output" style="margin-top:1rem;max-height:400px;"></div>
        <button class="tool-btn btn-primary" onclick="copyElement('lorem-output')" style="margin-top:0.5rem;"><i class="fas fa-copy"></i> Copy</button>
    </div>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <script src="components.js"></script>
    <script>
        const loremText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt.";
        function generateLorem() {
            const count = parseInt(document.getElementById('lorem-count').value);
            const sentences = loremText.split('. ').filter(s => s.trim());
            let result = [];
            for (let i = 0; i < count; i++) {
                let para = [];
                for (let j = 0; j < Math.floor(Math.random()*5)+3; j++) para.push(sentences[Math.floor(Math.random()*sentences.length)].trim() + '.');
                result.push(para.join(' '));
            }
            document.getElementById('lorem-output').textContent = result.join('\n\n');
        }
        generateLorem();
    </script>
</body>
</html>
