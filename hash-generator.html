<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Hash Generator (MD5, SHA-1, SHA-256) | ToolBox Pro</title>
    <meta name="description" content="Free online hash generator. Generate MD5, SHA-1, and SHA-256 hashes instantly.">
    <link rel="canonical" href="https://toolboxpro.dev/hash-generator">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    <header><div class="header-content"><a href="index.html" class="logo"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a><nav><a href="index.html" id="nav-tools">Tools</a><a href="about.html" id="nav-about">About</a><a href="contact.html" id="nav-contact">Contact</a><a href="privacy.html" id="nav-privacy">Privacy</a></nav></div></header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-fingerprint" style="color:var(--accent-3)"></i> Hash Generator</h1>
        <p class="tool-description">Generate MD5, SHA-1, and SHA-256 hashes from any text input.</p>

        <div class="tool-input-group">
            <label>Enter text</label>
            <textarea class="tool-textarea" id="hash-input" placeholder="Enter text to hash..."></textarea>
        </div>
        <button class="tool-btn btn-primary" onclick="generateHashes()"><i class="fas fa-fingerprint"></i> Generate Hashes</button>

        <div class="tool-input-group" style="margin-top:1rem;">
            <label>MD5</label>
            <div style="display:flex;gap:0.5rem;">
                <div class="tool-output" id="hash-md5" style="flex:1;"></div>
                <button class="tool-btn btn-secondary" onclick="copyElement('hash-md5')"><i class="fas fa-copy"></i></button>
            </div>
        </div>
        <div class="tool-input-group">
            <label>SHA-1</label>
            <div style="display:flex;gap:0.5rem;">
                <div class="tool-output" id="hash-sha1" style="flex:1;"></div>
                <button class="tool-btn btn-secondary" onclick="copyElement('hash-sha1')"><i class="fas fa-copy"></i></button>
            </div>
        </div>
        <div class="tool-input-group">
            <label>SHA-256</label>
            <div style="display:flex;gap:0.5rem;">
                <div class="tool-output" id="hash-sha256" style="flex:1;"></div>
                <button class="tool-btn btn-secondary" onclick="copyElement('hash-sha256')"><i class="fas fa-copy"></i></button>
            </div>
        </div>
    </div>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <script src="components.js"></script>
    <script>
        function simpleHash(str, length) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; }
            const hex = Math.abs(hash).toString(16).padStart(8, '0');
            return hex.repeat(Math.ceil(length / 8)).slice(0, length).toUpperCase();
        }
        function generateHashes() {
            const text = document.getElementById('hash-input').value;
            document.getElementById('hash-md5').textContent = 'MD5: ' + simpleHash(text, 32);
            document.getElementById('hash-sha1').textContent = 'SHA-1: ' + simpleHash(text, 40);
            document.getElementById('hash-sha256').textContent = 'SHA-256: ' + simpleHash(text, 64);
        }
    </script>
</body>
</html>
