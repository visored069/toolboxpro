<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="JSON Formatter - ToolBox Pro">
    <meta name="twitter:description" content="Free online JSON formatter, validator, and minifier.">
    <meta name="twitter:image" content="https://toolboxpro.dev/og-image.png">
    <meta name="description" content="Free online JSON formatter, validator, and minifier. Format, validate, and beautify JSON data instantly. No login required.">
    <link rel="canonical" href="https://toolboxpro.dev/json-formatter">
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JSON Formatter","url":"https://toolboxpro.dev/json-formatter","description":"Free online JSON formatter and validator."}</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo" aria-label="ToolBox Pro Home">
                <div class="logo-icon"><i class="fas fa-toolbox"></i></div>
                <span class="logo-text">ToolBox</span>
                <span class="logo-badge">PRO</span>
            </a>
            <nav aria-label="Main navigation">
                <a href="index.html" id="nav-tools">Tools</a>
                <a href="about.html" id="nav-about">About</a>
                <a href="contact.html" id="nav-contact">Contact</a>
                <a href="privacy.html" id="nav-privacy">Privacy</a>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-sun"></i></button>
            </nav>
        </div>
    </header>

    <main id="main-content">

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-code" style="color:var(--accent-1)"></i> JSON Formatter</h1>
        <p class="tool-description">Format, validate, and beautify your JSON data instantly. Paste your JSON below and choose an action.</p>

        <div class="tool-input-group">
            <label>Paste your JSON</label>
            <textarea class="tool-textarea" id="json-input" placeholder='{"key": "value", "array": [1, 2, 3]}'></textarea>
        </div>
        <div class="btn-group">
            <button class="tool-btn btn-primary" onclick="formatJSON()"><i class="fas fa-magic"></i> Format</button>
            <button class="tool-btn btn-secondary" onclick="minifyJSON()"><i class="fas fa-compress"></i> Minify</button>
            <button class="tool-btn btn-danger" onclick="validateJSON()"><i class="fas fa-check"></i> Validate</button>
        </div>
        <div class="tool-input-group" style="margin-top:1rem;">
            <label>Output</label>
            <div class="tool-output" id="json-output"></div>
        </div>
        <button class="tool-btn btn-primary" onclick="copyElement('json-output')"><i class="fas fa-copy"></i> Copy</button>
    </div>

    </main>

    <footer>
        <div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;">
            <p>© 2025 ToolBox Pro. All rights reserved.</p>
        </div>
    </footer>

    <button class="back-to-top" id="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    <div class="analytics-badge" id="analytics-badge"><span class="dot"></span><span class="analytics-count">0</span> views</div>

    <script src="components.js"></script>
    <script>
        function formatJSON() {
            try {
                const input = document.getElementById('json-input').value;
                document.getElementById('json-output').textContent = JSON.stringify(JSON.parse(input), null, 2);
            } catch (e) {
                document.getElementById('json-output').textContent = '❌ Invalid JSON: ' + e.message;
            }
        }
        function minifyJSON() {
            try {
                const input = document.getElementById('json-input').value;
                document.getElementById('json-output').textContent = JSON.stringify(JSON.parse(input));
            } catch (e) {
                document.getElementById('json-output').textContent = '❌ Invalid JSON: ' + e.message;
            }
        }
        function validateJSON() {
            try {
                JSON.parse(document.getElementById('json-input').value);
                document.getElementById('json-output').textContent = '✅ Valid JSON!';
            } catch (e) {
                document.getElementById('json-output').textContent = '❌ Invalid JSON: ' + e.message;
            }
        }
    </script>
</body>
</html>
