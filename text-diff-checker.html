<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Text Diff Checker | ToolBox Pro</title>
    <meta name="description" content="Free online text diff checker. Compare two texts and highlight the differences. No login required.">
    <link rel="canonical" href="https://toolboxpro.dev/text-diff-checker">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .diff-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .diff-panel { position: relative; }
        .diff-panel label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-secondary); }
        .diff-panel textarea {
            width: 100%;
            min-height: 200px;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
            transition: border-color 0.3s;
        }
        .diff-panel textarea:focus { outline: none; border-color: var(--accent-1); box-shadow: 0 0 20px rgba(108,92,231,0.2); }
        .diff-output {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .diff-line { padding: 2px 8px; border-radius: 3px; }
        .diff-added { background: rgba(0,206,201,0.15); color: #81ecec; }
        .diff-removed { background: rgba(253,121,168,0.15); color: #fab1a0; }
        .diff-unchanged { color: var(--text-secondary); }
        .diff-stats { display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .diff-stat { padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .diff-stat.added { background: rgba(0,206,201,0.15); color: #81ecec; }
        .diff-stat.removed { background: rgba(253,121,168,0.15); color: #fab1a0; }
        .diff-stat.same { background: rgba(108,92,231,0.15); color: #a29bfe; }
        @media (max-width: 768px) { .diff-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-toolbox"></i></div>
                <span class="logo-text">ToolBox</span>
                <span class="logo-badge">PRO</span>
            </a>
            <nav>
                <a href="index.html">Tools</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy</a>
            </nav>
        </div>
    </header>

    <div class="tool-page" style="max-width:1000px;">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-not-equal" style="color:var(--accent-1)"></i> Text Diff Checker</h1>
        <p class="tool-description">Compare two pieces of text side by side and instantly see the differences highlighted.</p>

        <div class="diff-container">
            <div class="diff-panel">
                <label><i class="fas fa-file-alt"></i> Original Text</label>
                <textarea id="diff-left" placeholder="Paste the original text here...">Hello World
This is a sample text.
It has multiple lines.</textarea>
            </div>
            <div class="diff-panel">
                <label><i class="fas fa-pen"></i> Modified Text</label>
                <textarea id="diff-right" placeholder="Paste the modified text here...">Hello World
This is a modified text.
It has multiple lines.
And an extra line.</textarea>
            </div>
        </div>

        <div class="btn-group" style="margin-top:1.5rem;justify-content:center;">
            <button class="tool-btn btn-primary" onclick="compareDiff()"><i class="fas fa-search"></i> Compare</button>
            <button class="tool-btn btn-secondary" onclick="swapDiff()"><i class="fas fa-exchange-alt"></i> Swap</button>
            <button class="tool-btn btn-danger" onclick="clearDiff()"><i class="fas fa-trash"></i> Clear</button>
        </div>

        <div style="margin-top:1.5rem;">
            <label style="display:block;font-size:0.85rem;font-weight:500;margin-bottom:0.5rem;color:var(--text-secondary);">
                <i class="fas fa-eye"></i> Differences
            </label>
            <div class="diff-output" id="diff-output"></div>
            <div class="diff-stats" id="diff-stats"></div>
        </div>
    </div>

    <footer>
        <div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;">
            <p>© 2025 ToolBox Pro. All rights reserved.</p>
        </div>
    </footer>

    <script src="components.js"></script>
    <script>
        function compareDiff() {
            const left = document.getElementById('diff-left').value;
            const right = document.getElementById('diff-right').value;

            if (!left.trim() && !right.trim()) {
                document.getElementById('diff-output').innerHTML = '<div class="diff-line diff-unchanged">Paste some text in both fields to compare.</div>';
                return;
            }

            const leftLines = left.split('\n');
            const rightLines = right.split('\n');

            let output = [];
            let added = 0, removed = 0, same = 0;

            const maxLen = Math.max(leftLines.length, rightLines.length);

            for (let i = 0; i < maxLen; i++) {
                const l = i < leftLines.length ? leftLines[i] : undefined;
                const r = i < rightLines.length ? rightLines[i] : undefined;

                if (l === r) {
                    output.push('<div class="diff-line diff-unchanged">  ' + escapeHtml(l || '') + '</div>');
                    same++;
                } else {
                    if (l !== undefined) {
                        output.push('<div class="diff-line diff-removed">- ' + escapeHtml(l) + '</div>');
                        removed++;
                    }
                    if (r !== undefined) {
                        output.push('<div class="diff-line diff-added">+ ' + escapeHtml(r) + '</div>');
                        added++;
                    }
                }
            }

            document.getElementById('diff-output').innerHTML = output.join('');
            document.getElementById('diff-stats').innerHTML =
                '<span class="diff-stat added">+ ' + added + ' added</span>' +
                '<span class="diff-stat removed">- ' + removed + ' removed</span>' +
                '<span class="diff-stat same">= ' + same + ' unchanged</span>';
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function swapDiff() {
            const left = document.getElementById('diff-left').value;
            const right = document.getElementById('diff-right').value;
            document.getElementById('diff-left').value = right;
            document.getElementById('diff-right').value = left;
            compareDiff();
        }

        function clearDiff() {
            document.getElementById('diff-left').value = '';
            document.getElementById('diff-right').value = '';
            document.getElementById('diff-output').innerHTML = '';
            document.getElementById('diff-stats').innerHTML = '';
        }

        compareDiff();
    </script>
</body>
</html>
