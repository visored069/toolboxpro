<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="JSON to CSV Converter - ToolBox Pro">

    <meta property="og:image" content="https://toolboxpro.dev/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="JSON to CSV - ToolBox Pro">
    <meta name="twitter:image" content="https://toolboxpro.dev/og-image.png">
    <meta name="description" content="Free online JSON to CSV converter. Convert JSON data to CSV format instantly.">
    <link rel="canonical" href="https://toolboxpro.dev/json-to-csv">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    <header><div class="header-content"><a href="index.html" class="logo" aria-label="ToolBox Pro Home"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a><nav aria-label="Main navigation"><a href="index.html">Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-sun"></i></button></nav></div></header>

    <main id="main-content">

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-file-csv" style="color:var(--accent-2)"></i> JSON to CSV Converter</h1>
        <p class="tool-description">Convert JSON arrays to CSV format. Paste your JSON data below.</p>

        <div class="tool-input-group">
            <label>Paste JSON array</label>
            <textarea class="tool-textarea" id="json-input" placeholder='[{"name":"John","age":30},{"name":"Jane","age":25}]'></textarea>
        </div>
        <div class="btn-group">
            <button class="tool-btn btn-primary" onclick="convertToCSV()"><i class="fas fa-exchange-alt"></i> Convert to CSV</button>
            <button class="tool-btn btn-secondary" onclick="downloadCSV()"><i class="fas fa-download"></i> Download CSV</button>
        </div>
        <div class="tool-input-group" style="margin-top:1rem;">
            <label>CSV Output</label>
            <div class="tool-output" id="csv-output" style="min-height:150px;"></div>
        </div>
        <button class="tool-btn btn-primary" onclick="copyElement('csv-output')"><i class="fas fa-copy"></i> Copy</button>
    </div>
    </main>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <button class="back-to-top" id="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    <div class="analytics-badge" id="analytics-badge"><span class="dot"></span><span class="analytics-count">0</span> views</div>
    <script src="components.js"></script>
    <script>
        function convertToCSV() {
            try {
                const data = JSON.parse(document.getElementById('json-input').value);
                if (!Array.isArray(data) || data.length === 0) {
                    document.getElementById('csv-output').textContent = '❌ Please provide a non-empty JSON array';
                    return;
                }
                const headers = [...new Set(data.flatMap(obj => Object.keys(obj)))];
                const csvRows = [headers.join(',')];
                data.forEach(obj => {
                    csvRows.push(headers.map(h => {
                        let val = obj[h] !== undefined ? String(obj[h]) : '';
                        if (val.includes(',') || val.includes('"') || val.includes('\n')) {
                            val = '"' + val.replace(/"/g, '""') + '"';
                        }
                        return val;
                    }).join(','));
                });
                document.getElementById('csv-output').textContent = csvRows.join('\n');
            } catch(e) {
                document.getElementById('csv-output').textContent = '❌ Error: ' + e.message;
            }
        }
        function downloadCSV() {
            const csv = document.getElementById('csv-output').textContent;
            if (!csv || csv.startsWith('❌')) return;
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'data.csv'; a.click();
            URL.revokeObjectURL(url);
            showToast('✓ CSV downloaded!');
        }
    </script>
</body>
</html>
