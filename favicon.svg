<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.9)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- compass ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="14"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  <!-- N marker -->
  <text x="256" y="118" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Arial, sans-serif" font-size="52" font-weight="bold">N</text>
  <!-- needle (north = amber, south = white) -->
  <polygon points="256,136 288,256 256,376 224,256" fill="url(#needle)"/>
  <polygon points="136,256 256,224 376,256 256,288" fill="rgba(255,255,255,0.35)"/>
  <!-- center pin -->
  <circle cx="256" cy="256" r="26" fill="#ffffff"/>
  <circle cx="256" cy="256" r="12" fill="#6366f1"/>
</svg>
