<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Timestamp Converter | ToolBox Pro</title>
    <meta name="description" content="Free online Unix timestamp converter. Convert between Unix timestamps and human-readable dates. No login required.">
    <link rel="canonical" href="https://toolboxpro.dev/timestamp-converter">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-toolbox"></i></div>
                <span class="logo-text">ToolBox</span>
                <span class="logo-badge">PRO</span>
            </a>
            <nav>
                <a href="index.html">Tools</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy</a>
            </nav>
        </div>
    </header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-clock" style="color:var(--accent-1)"></i> Timestamp Converter</h1>
        <p class="tool-description">Convert between Unix timestamps and human-readable dates. Check the current timestamp or convert any date.</p>

        <div class="tool-input-group">
            <label>Current Timestamp</label>
            <div style="display:flex;gap:0.75rem;align-items:center;">
                <div class="tool-output" id="current-timestamp" style="flex:1;margin:0;"></div>
                <button class="tool-btn btn-primary" onclick="copyElement('current-timestamp')"><i class="fas fa-copy"></i></button>
            </div>
            <p style="color:var(--text-secondary);font-size:0.8rem;margin-top:0.5rem;" id="current-date"></p>
        </div>

        <hr style="border:none;border-top:1px solid var(--border-color);margin:2rem 0;">

        <h3 style="font-size:1.1rem;margin-bottom:1rem;">Timestamp → Date</h3>
        <div class="tool-input-group">
            <label>Enter Unix Timestamp (seconds or milliseconds)</label>
            <input class="tool-input" id="ts-input" type="text" placeholder="e.g. 1700000000" oninput="tsToDate()">
        </div>
        <div class="tool-input-group">
            <label>Converted Date</label>
            <div class="tool-output" id="ts-output"></div>
        </div>

        <hr style="border:none;border-top:1px solid var(--border-color);margin:2rem 0;">

        <h3 style="font-size:1.1rem;margin-bottom:1rem;">Date → Timestamp</h3>
        <div class="tool-input-group">
            <label>Select Date & Time</label>
            <input class="tool-input" id="date-input" type="datetime-local" oninput="dateToTs()">
        </div>
        <div class="tool-input-group">
            <label>Unix Timestamp</label>
            <div style="display:flex;gap:0.75rem;align-items:center;">
                <div class="tool-output" id="date-output" style="flex:1;margin:0;"></div>
                <button class="tool-btn btn-primary" onclick="copyElement('date-output')"><i class="fas fa-copy"></i></button>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;">
            <p>© 2025 ToolBox Pro. All rights reserved.</p>
        </div>
    </footer>

    <script src="components.js"></script>
    <script>
        function updateCurrentTs() {
            const now = Math.floor(Date.now() / 1000);
            document.getElementById('current-timestamp').textContent = now;
            document.getElementById('current-date').textContent = new Date().toUTCString();
        }
        setInterval(updateCurrentTs, 1000);
        updateCurrentTs();

        function tsToDate() {
            const val = document.getElementById('ts-input').value.trim();
            if (!val) { document.getElementById('ts-output').textContent = ''; return; }
            let ts = parseInt(val, 10);
            if (isNaN(ts)) { document.getElementById('ts-output').textContent = '❌ Invalid timestamp'; return; }
            if (ts > 9999999999) ts = ts; else ts = ts * 1000;
            const date = new Date(ts);
            if (isNaN(date.getTime())) { document.getElementById('ts-output').textContent = '❌ Invalid timestamp'; return; }
            document.getElementById('ts-output').textContent =
                'UTC:   ' + date.toUTCString() + '\n' +
                'Local: ' + date.toLocaleString() + '\n' +
                'ISO:   ' + date.toISOString();
        }

        function dateToTs() {
            const val = document.getElementById('date-input').value;
            if (!val) { document.getElementById('date-output').textContent = ''; return; }
            const date = new Date(val);
            document.getElementById('date-output').textContent = Math.floor(date.getTime() / 1000);
        }

        document.getElementById('date-input').value = new Date().toISOString().slice(0, 16);
        dateToTs();
    </script>
</body>
</html>
