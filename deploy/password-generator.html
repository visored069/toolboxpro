<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Password Generator | ToolBox Pro</title>
    <meta name="description" content="Free online secure password generator. Generate strong, random passwords with customizable length and characters.">
    <link rel="canonical" href="https://toolboxpro.dev/password-generator">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    <header><div class="header-content"><a href="index.html" class="logo"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a><nav><a href="index.html" id="nav-tools">Tools</a><a href="about.html" id="nav-about">About</a><a href="contact.html" id="nav-contact">Contact</a><a href="privacy.html" id="nav-privacy">Privacy</a></nav></div></header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-lock" style="color:var(--accent-3)"></i> Password Generator</h1>
        <p class="tool-description">Generate strong, secure passwords with customizable options. Uses cryptographically secure random numbers.</p>

        <div class="tool-input-group">
            <label>Password Length</label>
            <div class="range-group">
                <input type="range" id="pwd-length" min="8" max="64" value="16" oninput="document.getElementById('pwd-length-val').textContent=this.value">
                <span class="range-value" id="pwd-length-val">16</span>
            </div>
        </div>
        <div class="tool-input-group">
            <label>Include</label>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" id="pwd-upper" checked><span class="check"></span>Uppercase (A-Z)</label>
                <label class="checkbox-label"><input type="checkbox" id="pwd-lower" checked><span class="check"></span>Lowercase (a-z)</label>
                <label class="checkbox-label"><input type="checkbox" id="pwd-numbers" checked><span class="check"></span>Numbers (0-9)</label>
                <label class="checkbox-label"><input type="checkbox" id="pwd-symbols" checked><span class="check"></span>Symbols (!@#$)</label>
            </div>
        </div>
        <div class="btn-group">
            <button class="tool-btn btn-primary" onclick="generatePassword()"><i class="fas fa-sync"></i> Generate</button>
        </div>
        <div class="tool-input-group" style="margin-top:1rem;">
            <label>Generated Password</label>
            <div style="display:flex;gap:0.5rem;">
                <div class="tool-output" id="pwd-output" style="flex:1;font-size:1.1rem;"></div>
                <button class="tool-btn btn-secondary" onclick="copyElement('pwd-output')"><i class="fas fa-copy"></i></button>
            </div>
        </div>
        <button class="tool-btn btn-danger" onclick="generatePassword()"><i class="fas fa-sync"></i> Regenerate</button>
    </div>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <script src="components.js"></script>
    <script>
        function generatePassword() {
            const length = parseInt(document.getElementById('pwd-length').value);
            let chars = '';
            if (document.getElementById('pwd-upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (document.getElementById('pwd-lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (document.getElementById('pwd-numbers').checked) chars += '0123456789';
            if (document.getElementById('pwd-symbols').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            if (!chars) chars = 'abcdefghijklmnopqrstuvwxyz';
            let password = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            for (let i = 0; i < length; i++) password += chars[array[i] % chars.length];
            document.getElementById('pwd-output').textContent = password;
        }
        generatePassword();
    </script>
</body>
</html>
