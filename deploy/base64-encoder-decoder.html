<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Base64 Encoder & Decoder | ToolBox Pro</title>
    <meta name="description" content="Free online Base64 encoder and decoder. Encode and decode Base64 strings instantly.">
    <link rel="canonical" href="https://toolboxpro.dev/base64-encoder-decoder">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    <header><div class="header-content"><a href="index.html" class="logo"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a><nav><a href="index.html" id="nav-tools">Tools</a><a href="about.html" id="nav-about">About</a><a href="contact.html" id="nav-contact">Contact</a><a href="privacy.html" id="nav-privacy">Privacy</a></nav></div></header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-exchange-alt" style="color:var(--accent-2)"></i> Base64 Encoder/Decoder</h1>
        <p class="tool-description">Encode and decode Base64 strings easily. Enter your text and choose encode or decode.</p>

        <div class="tool-input-group">
            <label>Enter text</label>
            <textarea class="tool-textarea" id="base64-input" placeholder="Enter text to encode or decode..."></textarea>
        </div>
        <div class="toggle-group" style="margin-bottom:1rem;">
            <button class="toggle-btn active" id="btn-encode" onclick="setMode('encode')">Encode</button>
            <button class="toggle-btn" id="btn-decode" onclick="setMode('decode')">Decode</button>
        </div>
        <button class="tool-btn btn-primary" onclick="processBase64()"><i class="fas fa-play"></i> Process</button>
        <div class="tool-input-group" style="margin-top:1rem;">
            <label>Output</label>
            <div class="tool-output" id="base64-output"></div>
        </div>
        <button class="tool-btn btn-primary" onclick="copyElement('base64-output')"><i class="fas fa-copy"></i> Copy</button>
    </div>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <script src="components.js"></script>
    <script>
        let mode = 'encode';
        function setMode(m) {
            mode = m;
            document.getElementById('btn-encode').className = 'toggle-btn' + (m==='encode'?' active':'');
            document.getElementById('btn-decode').className = 'toggle-btn' + (m==='decode'?' active':'');
        }
        function processBase64() {
            try {
                const input = document.getElementById('base64-input').value;
                document.getElementById('base64-output').textContent = mode==='encode' ? btoa(unescape(encodeURIComponent(input))) : decodeURIComponent(escape(atob(input)));
            } catch(e) { document.getElementById('base64-output').textContent = '❌ Error: ' + e.message; }
        }
    </script>
</body>
</html>
