<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Text Case Converter | ToolBox Pro</title>
    <meta name="description" content="Free online text case converter. Convert text to UPPERCASE, lowercase, Title Case, Sentence case, and more instantly.">
    <link rel="canonical" href="https://toolboxpro.dev/text-case-converter">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    <header><div class="header-content"><a href="index.html" class="logo"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a><nav><a href="index.html">Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></nav></div></header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-text-height" style="color:var(--accent-2)"></i> Text Case Converter</h1>
        <p class="tool-description">Convert your text to any case format instantly. Works with any text length.</p>

        <div class="tool-input-group">
            <label>Enter your text</label>
            <textarea class="tool-textarea" id="text-input" placeholder="Type or paste your text here..."></textarea>
        </div>
        
        <div class="btn-group" style="margin-bottom:1.5rem;">
            <button class="tool-btn btn-primary" onclick="convertCase('upper')"><i class="fas fa-arrow-up"></i> UPPERCASE</button>
            <button class="tool-btn btn-secondary" onclick="convertCase('lower')"><i class="fas fa-arrow-down"></i> lowercase</button>
            <button class="tool-btn btn-danger" onclick="convertCase('title')"><i class="fas fa-font"></i> Title Case</button>
            <button class="tool-btn btn-primary" onclick="convertCase('sentence')"><i class="fas fa-paragraph"></i> Sentence case</button>
            <button class="tool-btn btn-secondary" onclick="convertCase('toggle')">aLtErNaTiNg CaSe</button>
            <button class="tool-btn btn-danger" onclick="convertCase('inverse')">iNvErSe CaSe</button>
            <button class="tool-btn btn-primary" onclick="convertCase('capitalized')">Capitalized Case</button>
        </div>

        <div class="tool-input-group">
            <label>Output</label>
            <div class="tool-output" id="text-output" style="min-height:100px;"></div>
        </div>
        <button class="tool-btn btn-primary" onclick="copyElement('text-output')"><i class="fas fa-copy"></i> Copy</button>
    </div>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <script src="components.js"></script>
    <script>
        function convertCase(type) {
            const text = document.getElementById('text-input').value;
            let result = '';
            switch(type) {
                case 'upper': result = text.toUpperCase(); break;
                case 'lower': result = text.toLowerCase(); break;
                case 'title': result = text.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase()); break;
                case 'sentence': result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase()); break;
                case 'toggle': result = text.split('').map((c,i) => i%2 ? c.toUpperCase() : c.toLowerCase()).join(''); break;
                case 'inverse': result = text.split('').map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join(''); break;
                case 'capitalized': result = text.replace(/\b\w/g, c => c.toUpperCase()); break;
            }
            document.getElementById('text-output').textContent = result;
        }
    </script>
</body>
</html>
