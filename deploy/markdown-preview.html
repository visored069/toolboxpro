<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Markdown Preview | ToolBox Pro</title>
    <meta name="description" content="Free online Markdown preview editor. Write Markdown and see live preview instantly.">
    <link rel="canonical" href="https://toolboxpro.dev/markdown-preview">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .md-container{display:grid;grid-template-columns:1fr 1fr;gap:1rem;min-height:400px;}
        .md-pane{background:rgba(0,0,0,0.3);border:1px solid var(--border-color);border-radius:10px;padding:1rem;overflow-y:auto;}
        .md-pane h3{margin-bottom:1rem;color:var(--text-secondary);font-size:0.85rem;}
        .md-preview{line-height:1.8;color:var(--text-secondary);}
        .md-preview h1,.md-preview h2,.md-preview h3,.md-preview h4{color:var(--text-primary);margin:1rem 0 0.5rem;}
        .md-preview h1{font-size:1.8rem;} .md-preview h2{font-size:1.5rem;} .md-preview h3{font-size:1.25rem;}
        .md-preview p{margin-bottom:0.75rem;}
        .md-preview code{background:rgba(108,92,231,0.2);padding:0.15rem 0.4rem;border-radius:4px;font-family:'Courier New',monospace;font-size:0.9em;color:var(--accent-1);}
        .md-preview pre{background:rgba(0,0,0,0.4);padding:1rem;border-radius:8px;overflow-x:auto;margin:0.75rem 0;}
        .md-preview pre code{background:none;padding:0;}
        .md-preview ul,.md-preview ol{padding-left:1.5rem;margin:0.5rem 0;}
        .md-preview li{margin-bottom:0.25rem;}
        .md-preview blockquote{border-left:3px solid var(--accent-1);padding-left:1rem;margin:0.75rem 0;color:var(--text-secondary);font-style:italic;}
        .md-preview a{color:var(--accent-1);text-decoration:underline;}
        .md-preview strong{color:var(--text-primary);}
        .md-preview hr{border:none;border-top:1px solid var(--border-color);margin:1rem 0;}
        .md-preview table{border-collapse:collapse;width:100%;margin:0.75rem 0;}
        .md-preview th,.md-preview td{border:1px solid var(--border-color);padding:0.5rem;text-align:left;}
        .md-preview th{background:rgba(108,92,231,0.1);color:var(--text-primary);}
        @media(max-width:768px){.md-container{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    <header><div class="header-content"><a href="index.html" class="logo"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a><nav><a href="index.html">Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></nav></div></header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-eye" style="color:var(--accent-1)"></i> Markdown Preview</h1>
        <p class="tool-description">Write Markdown on the left, see live preview on the right. Supports full Markdown syntax.</p>

        <div class="md-container">
            <div class="md-pane">
                <h3><i class="fas fa-edit"></i> Markdown Input</h3>
                <textarea id="md-input" style="width:100%;min-height:350px;background:transparent;border:none;color:var(--text-primary);font-family:'Courier New',monospace;resize:vertical;font-size:0.9rem;line-height:1.7;outline:none;" oninput="renderMarkdown()" placeholder="# Heading&#10;&#10;Write your **Markdown** here..."></textarea>
            </div>
            <div class="md-pane">
                <h3><i class="fas fa-eye"></i> Preview</h3>
                <div class="md-preview" id="md-preview"></div>
            </div>
        </div>
    </div>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <script src="components.js"></script>
    <script>
        function renderMarkdown() {
            let md = document.getElementById('md-input').value;
            let html = md
                .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/^# (.*$)/gm, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>')
                .replace(/^\> (.*$)/gm, '<blockquote>$1</blockquote>')
                .replace(/^---$/gm, '<hr>')
                .replace(/^\- (.*$)/gm, '<li>$1</li>')
                .replace(/^(\d+)\. (.*$)/gm, '<li>$2</li>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
            if (!html.includes('<h')) html = '<p>' + html + '</p>';
            document.getElementById('md-preview').innerHTML = html;
        }
        // Default example
        document.getElementById('md-input').value = "# Hello World\n\nThis is a **Markdown** preview tool.\n\n## Features\n\n- Real-time preview\n- Supports **bold** and *italic*\n- Code blocks\n- Links and more\n\n### Code Example\n\n```\nconst hello = 'world';\nconsole.log(hello);\n```\n\n> This is a blockquote\n\n---\n\n[Visit Google](https://google.com)";
        renderMarkdown();
    </script>
</body>
</html>
