<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  <g transform="translate(50,50)">
    <!-- Toolbox body -->
    <rect x="-22" y="-8" width="44" height="28" rx="3" fill="white"/>
    <!-- Lid -->
    <rect x="-26" y="-14" width="52" height="10" rx="3" fill="white"/>
    <!-- Handle -->
    <rect x="-8" y="-20" width="16" height="8" rx="4" fill="white"/>
    <!-- Front clasp -->
    <rect x="-4" y="-2" width="8" height="6" rx="1" fill="#6c5ce7"/>
    <!-- Lid line -->
    <line x1="-26" y1="-4" x2="26" y2="-4" stroke="#6c5ce7" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
