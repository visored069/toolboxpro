<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online CSS Minifier | ToolBox Pro</title>
    <meta name="description" content="Free online CSS minifier. Compress and minify your CSS code instantly to reduce file size. No login required.">
    <link rel="canonical" href="https://toolboxpro.dev/css-minifier">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-toolbox"></i></div>
                <span class="logo-text">ToolBox</span>
                <span class="logo-badge">PRO</span>
            </a>
            <nav>
                <a href="index.html">Tools</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy</a>
            </nav>
        </div>
    </header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-compress-arrows-alt" style="color:var(--accent-1)"></i> CSS Minifier</h1>
        <p class="tool-description">Minify your CSS code to reduce file size. Remove comments, whitespace, and unnecessary characters.</p>

        <div class="stats-row" style="margin-bottom:1.5rem;">
            <div class="stat-box"><div class="value" id="css-input-size">0 B</div><div class="label">Input Size</div></div>
            <div class="stat-box"><div class="value" id="css-output-size">0 B</div><div class="label">Output Size</div></div>
            <div class="stat-box"><div class="value" id="css-savings">0%</div><div class="label">Saved</div></div>
        </div>

        <div class="tool-input-group">
            <label>Paste your CSS</label>
            <textarea class="tool-textarea" id="css-input" placeholder="body {&#10;  margin: 0;&#10;  padding: 0;&#10;  /* comment */&#10;}" oninput="updateStats()"></textarea>
        </div>
        <div class="btn-group">
            <button class="tool-btn btn-primary" onclick="minifyCSS()"><i class="fas fa-compress"></i> Minify</button>
            <button class="tool-btn btn-secondary" onclick="beautifyCSS()"><i class="fas fa-expand"></i> Beautify</button>
            <button class="tool-btn btn-danger" onclick="document.getElementById('css-input').value='';document.getElementById('css-output').textContent='';updateStats()"><i class="fas fa-trash"></i> Clear</button>
        </div>
        <div class="tool-input-group" style="margin-top:1rem;">
            <label>Output</label>
            <div class="tool-output" id="css-output"></div>
        </div>
        <button class="tool-btn btn-primary" onclick="copyElement('css-output')"><i class="fas fa-copy"></i> Copy</button>
    </div>

    <footer>
        <div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;">
            <p>© 2025 ToolBox Pro. All rights reserved.</p>
        </div>
    </footer>

    <script src="components.js"></script>
    <script>
        function updateStats() {
            const input = document.getElementById('css-input').value;
            const output = document.getElementById('css-output').textContent;
            document.getElementById('css-input-size').textContent = formatBytes(new Blob([input]).size);
            document.getElementById('css-output-size').textContent = output ? formatBytes(new Blob([output]).size) : '0 B';
            if (input && output && !output.startsWith('❌')) {
                const saved = ((1 - new Blob([output]).size / new Blob([input]).size) * 100).toFixed(1);
                document.getElementById('css-savings').textContent = saved + '%';
            } else {
                document.getElementById('css-savings').textContent = '0%';
            }
        }
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        function minifyCSS() {
            const css = document.getElementById('css-input').value;
            if (!css.trim()) { document.getElementById('css-output').textContent = '❌ Please paste some CSS.'; return; }
            try {
                let minified = css
                    .replace(/\/\*[\s\S]*?\*\//g, '')
                    .replace(/\s+/g, ' ')
                    .replace(/\s*([{}:;,])\s*/g, '$1')
                    .replace(/;}/g, '}')
                    .replace(/\s*>\s*/g, '>')
                    .replace(/\s*~\s*/g, '~')
                    .replace(/\s*\+\s*/g, '+')
                    .trim();
                document.getElementById('css-output').textContent = minified;
                updateStats();
            } catch (e) {
                document.getElementById('css-output').textContent = '❌ Error: ' + e.message;
            }
        }
        function beautifyCSS() {
            const css = document.getElementById('css-input').value;
            if (!css.trim()) { document.getElementById('css-output').textContent = '❌ Please paste some CSS.'; return; }
            try {
                let beautified = css
                    .replace(/\s*{\s*/g, ' {\n  ')
                    .replace(/\s*}\s*/g, '\n}\n\n')
                    .replace(/;\s*/g, ';\n  ')
                    .replace(/\n  \n/g, '\n')
                    .trim();
                document.getElementById('css-output').textContent = beautified;
                updateStats();
            } catch (e) {
                document.getElementById('css-output').textContent = '❌ Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
