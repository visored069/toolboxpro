<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToolBox Pro - Open Graph Image</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
        }
        .glow-1 { background: #6c5ce7; top: -200px; left: -100px; }
        .glow-2 { background: #00cec9; bottom: -200px; right: -100px; }
        .glow-3 { background: #fd79a8; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.15; }
        .content { position: relative; z-index: 1; text-align: center; }
        .logo-box {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 2rem;
            box-shadow: 0 20px 60px rgba(108, 92, 231, 0.4);
        }
        h1 {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        .tagline {
            font-size: 1.5rem;
            color: #a0a0b0;
            margin-bottom: 2rem;
        }
        .stats {
            display: flex;
            gap: 3rem;
            justify-content: center;
        }
        .stat { text-align: center; }
        .stat-num {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00cec9, #81ecec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-lbl { color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .url {
            position: absolute;
            bottom: 40px;
            color: #555;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-glow glow-3"></div>
    <div class="content">
        <div class="logo-box">🧰</div>
        <h1>ToolBox Pro</h1>
        <p class="tagline">20+ Free Online Developer Tools</p>
        <div class="stats">
            <div class="stat"><div class="stat-num">20+</div><div class="stat-lbl">Tools</div></div>
            <div class="stat"><div class="stat-num">100%</div><div class="stat-lbl">Free</div></div>
            <div class="stat"><div class="stat-num">0 Ads</div><div class="stat-lbl">Clean</div></div>
        </div>
    </div>
    <div class="url">toolboxpro.vercel.app</div>
</body>
</html>
