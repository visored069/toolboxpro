<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Word & Character Counter | ToolBox Pro</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://toolboxpro.dev/word-counter">
    <meta property="og:title" content="Word Counter - ToolBox Pro">
    <meta property="og:description" content="Free online word counter, character counter, sentence counter.">
    <meta property="og:image" content="https://toolboxpro.dev/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Word Counter - ToolBox Pro">
    <meta name="twitter:image" content="https://toolboxpro.dev/og-image.png">
    <meta name="description" content="Free online word counter, character counter, sentence counter. Count words, characters, sentences, paragraphs, and reading time.">
    <link rel="canonical" href="https://toolboxpro.dev/word-counter">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo" aria-label="ToolBox Pro Home"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a>
            <nav aria-label="Main navigation">
                <a href="index.html" id="nav-tools">Tools</a>
                <a href="about.html" id="nav-about">About</a>
                <a href="contact.html" id="nav-contact">Contact</a>
                <a href="privacy.html" id="nav-privacy">Privacy</a>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-sun"></i></button>
            </nav>
        </div>
    </header>

    <main id="main-content">

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-font" style="color:var(--accent-2)"></i> Word Counter</h1>
        <p class="tool-description">Count words, characters, sentences, paragraphs, and estimated reading time.</p>

        <div class="tool-input-group">
            <label>Enter your text</label>
            <textarea class="tool-textarea" id="wordcount-input" placeholder="Type or paste your text here..." oninput="countWords()"></textarea>
        </div>
        <div class="stats-row">
            <div class="stat-box"><div class="value" id="wc-words">0</div><div class="label">Words</div></div>
            <div class="stat-box"><div class="value" id="wc-chars">0</div><div class="label">Characters</div></div>
            <div class="stat-box"><div class="value" id="wc-chars-nospace">0</div><div class="label">No Spaces</div></div>
            <div class="stat-box"><div class="value" id="wc-sentences">0</div><div class="label">Sentences</div></div>
            <div class="stat-box"><div class="value" id="wc-paragraphs">0</div><div class="label">Paragraphs</div></div>
            <div class="stat-box"><div class="value" id="wc-readtime">0</div><div class="label">Read Time (min)</div></div>
        </div>
    </div>
    </main>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <button class="back-to-top" id="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    <div class="analytics-badge" id="analytics-badge"><span class="dot"></span><span class="analytics-count">0</span> views</div>

    <script src="components.js"></script>
    <script>
        function countWords() {
            const text = document.getElementById('wordcount-input').value;
            document.getElementById('wc-words').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('wc-chars').textContent = text.length;
            document.getElementById('wc-chars-nospace').textContent = text.replace(/\s/g, '').length;
            document.getElementById('wc-sentences').textContent = text.trim() ? text.split(/[.!?]+/).filter(s => s.trim()).length : 0;
            document.getElementById('wc-paragraphs').textContent = text.trim() ? text.split(/\n\n+/).filter(p => p.trim()).length : 0;
            document.getElementById('wc-readtime').textContent = Math.max(1, Math.ceil(text.trim().split(/\s+/).length / 200));
        }
    </script>
</body>
</html>
