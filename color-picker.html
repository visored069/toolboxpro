<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Color Picker | ToolBox Pro</title>
    <meta name="description" content="Free online color picker tool. Pick colors and get HEX, RGB, and HSL values instantly.">
    <link rel="canonical" href="https://toolboxpro.dev/color-picker">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    <header><div class="header-content"><a href="index.html" class="logo"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a><nav><a href="index.html" id="nav-tools">Tools</a><a href="about.html" id="nav-about">About</a><a href="contact.html" id="nav-contact">Contact</a><a href="privacy.html" id="nav-privacy">Privacy</a></nav></div></header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-palette" style="color:var(--accent-1)"></i> Color Picker</h1>
        <p class="tool-description">Pick any color and get HEX, RGB, and HSL values. Click on a value to copy it.</p>

        <div class="tool-input-group">
            <label>Pick a color</label>
            <input type="color" id="color-picker" value="#6c5ce7" onchange="updateColor()" style="width:100%;height:50px;border:none;border-radius:10px;cursor:pointer;">
        </div>
        <div class="color-preview" id="color-preview" style="background:#6c5ce7;"></div>
        <div class="color-values">
            <div class="color-value" onclick="copyText(document.getElementById('color-hex').textContent)"><div class="label">HEX</div><div class="value" id="color-hex">#6c5ce7</div></div>
            <div class="color-value" onclick="copyText(document.getElementById('color-rgb').textContent)"><div class="label">RGB</div><div class="value" id="color-rgb">rgb(108, 92, 231)</div></div>
            <div class="color-value" onclick="copyText(document.getElementById('color-hsl').textContent)"><div class="label">HSL</div><div class="value" id="color-hsl">hsl(247, 75%, 63%)</div></div>
        </div>
    </div>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <script src="components.js"></script>
    <script>
        function updateColor() {
            const hex = document.getElementById('color-picker').value;
            document.getElementById('color-preview').style.background = hex;
            document.getElementById('color-hex').textContent = hex;
            const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            document.getElementById('color-rgb').textContent = `rgb(${r}, ${g}, ${b})`;
            const rr=r/255, gg=g/255, bb=b/255, max=Math.max(rr,gg,bb), min=Math.min(rr,gg,bb);
            let h,s,l=(max+min)/2;
            if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case rr:h=((gg-bb)/d+(gg<bb?6:0))/6;break;case gg:h=((bb-rr)/d+2)/6;break;case bb:h=((rr-gg)/d+4)/6;break;}}
            document.getElementById('color-hsl').textContent = `hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
        }
    </script>
</body>
</html>
