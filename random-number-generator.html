<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Random Number Generator | ToolBox Pro</title>
    <meta name="description" content="Free online random number generator. Generate random numbers, integers, decimals, and sequences. No login required.">
    <link rel="canonical" href="https://toolboxpro.dev/random-number-generator">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-toolbox"></i></div>
                <span class="logo-text">ToolBox</span>
                <span class="logo-badge">PRO</span>
            </a>
            <nav>
                <a href="index.html">Tools</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy</a>
            </nav>
        </div>
    </header>

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-dice" style="color:var(--accent-1)"></i> Random Number Generator</h1>
        <p class="tool-description">Generate cryptographically secure random numbers. Choose your range, count, and format.</p>

        <div class="tool-input-group">
            <label>Number Type</label>
            <div class="toggle-group">
                <button class="toggle-btn active" id="type-integer" onclick="setType('integer')">Integer</button>
                <button class="toggle-btn" id="type-decimal" onclick="setType('decimal')">Decimal</button>
            </div>
        </div>

        <div class="tool-input-group">
            <label>Minimum Value</label>
            <input class="tool-input" id="rand-min" type="number" value="1" placeholder="1">
        </div>

        <div class="tool-input-group">
            <label>Maximum Value</label>
            <input class="tool-input" id="rand-max" type="number" value="100" placeholder="100">
        </div>

        <div class="tool-input-group">
            <label id="decimal-label" style="display:none;">Decimal Places</label>
            <input class="tool-input" id="rand-decimals" type="number" value="2" min="1" max="10" style="display:none;" placeholder="2">
        </div>

        <div class="tool-input-group">
            <label>How many numbers?</label>
            <div class="range-group">
                <input type="range" id="rand-count" min="1" max="100" value="10" oninput="document.getElementById('rand-count-val').textContent=this.value">
                <span class="range-value" id="rand-count-val">10</span>
            </div>
        </div>

        <div class="tool-input-group">
            <label>Sort Order</label>
            <div class="toggle-group">
                <button class="toggle-btn active" id="sort-none" onclick="setSort('none')">None</button>
                <button class="toggle-btn" id="sort-asc" onclick="setSort('asc')">Ascending</button>
                <button class="toggle-btn" id="sort-desc" onclick="setSort('desc')">Descending</button>
            </div>
        </div>

        <div class="btn-group">
            <button class="tool-btn btn-primary" onclick="generateNumbers()"><i class="fas fa-sync"></i> Generate</button>
            <button class="tool-btn btn-secondary" onclick="copyElement('rand-output')"><i class="fas fa-copy"></i> Copy All</button>
        </div>

        <div class="tool-input-group" style="margin-top:1rem;">
            <label>Generated Numbers</label>
            <div class="tool-output" id="rand-output" style="min-height:120px;"></div>
        </div>
    </div>

    <footer>
        <div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;">
            <p>© 2025 ToolBox Pro. All rights reserved.</p>
        </div>
    </footer>

    <script src="components.js"></script>
    <script>
        let numType = 'integer';
        let sortMode = 'none';

        function setType(t) {
            numType = t;
            document.getElementById('type-integer').className = 'toggle-btn' + (t === 'integer' ? ' active' : '');
            document.getElementById('type-decimal').className = 'toggle-btn' + (t === 'decimal' ? ' active' : '');
            const show = t === 'decimal';
            document.getElementById('rand-decimals').style.display = show ? 'block' : 'none';
            document.getElementById('decimal-label').style.display = show ? 'block' : 'none';
        }

        function setSort(s) {
            sortMode = s;
            document.getElementById('sort-none').className = 'toggle-btn' + (s === 'none' ? ' active' : '');
            document.getElementById('sort-asc').className = 'toggle-btn' + (s === 'asc' ? ' active' : '');
            document.getElementById('sort-desc').className = 'toggle-btn' + (s === 'desc' ? ' active' : '');
        }

        function secureRandom(max) {
            const array = new Uint32Array(1);
            crypto.getRandomValues(array);
            return array[0] % max;
        }

        function generateNumbers() {
            const min = parseFloat(document.getElementById('rand-min').value);
            const max = parseFloat(document.getElementById('rand-max').value);
            const count = parseInt(document.getElementById('rand-count').value);
            const decimals = parseInt(document.getElementById('rand-decimals').value) || 2;

            if (isNaN(min) || isNaN(max) || min >= max) {
                document.getElementById('rand-output').textContent = '❌ Minimum must be less than Maximum.';
                return;
            }

            let numbers = [];
            for (let i = 0; i < count; i++) {
                if (numType === 'integer') {
                    const range = max - min + 1;
                    numbers.push(min + secureRandom(range));
                } else {
                    const raw = min + (crypto.getRandomValues(new Uint32Array(1))[0] / (0xFFFFFFFF + 1)) * (max - min);
                    numbers.push(parseFloat(raw.toFixed(decimals)));
                }
            }

            if (sortMode === 'asc') numbers.sort((a, b) => a - b);
            else if (sortMode === 'desc') numbers.sort((a, b) => b - a);

            document.getElementById('rand-output').textContent = numbers.join('\n');
        }

        generateNumbers();
    </script>
</body>
</html>
