name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC — external link-rot check

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: gen-sitemap derives lastmod from git dates

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Registry guardrail (claims, structure, colors)
        run: node lint-registry.js

      - name: Sitemap freshness + canonical parity
        run: node gen-sitemap.js

      - name: Sitemap is committed and current
        run: |
          if ! git diff --exit-code sitemap.xml; then
            echo "::error::sitemap.xml is stale — run 'node gen-sitemap.js' after dataset changes and commit the result."
            exit 1
          fi

      - name: Internal link integrity
        run: node check-links.js

  # Deployment: Vercel's native Git integration deploys production on every
  # push to master — no deploy job here, by design. A `deploy` job that pings
  # VERCEL_DEPLOY_HOOK_URL only made sense as a post-checks gate; without the
  # secret it warned and exited 0 while Git integration had already deployed,
  # so the "gate" was decorative. To re-introduce a real gate:
  #   1) disable Vercel Git integration (Vercel → Settings → Git),
  #   2) add a deploy hook URL as the VERCEL_DEPLOY_HOOK_URL secret,
  #   3) restore a deploy job here that needs: [checks] and POSTs the hook.

  link-rot:
    # Weekly external URL check for the whole directory (AI + dev tools).
    # Warnings (bot-walls/timeouts) don't fail; genuinely dead links do.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check external registry URLs
        run: node check-external-links.js
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.md
