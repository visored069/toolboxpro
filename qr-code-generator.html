<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online QR Code Generator | ToolBox Pro</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://toolboxpro.dev/qr-code-generator">
    <meta property="og:title" content="QR Code Generator - ToolBox Pro">
    <meta property="og:description" content="Free online QR code generator. Create QR codes for any text or URL.">
    <meta property="og:image" content="https://toolboxpro.dev/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="QR Code Generator - ToolBox Pro">
    <meta name="twitter:image" content="https://toolboxpro.dev/og-image.png">
    <meta name="description" content="Free online QR code generator. Create QR codes for any text, URL, or data instantly.">
    <link rel="canonical" href="https://toolboxpro.dev/qr-code-generator">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    <header><div class="header-content"><a href="index.html" class="logo" aria-label="ToolBox Pro Home"><div class="logo-icon"><i class="fas fa-toolbox"></i></div><span class="logo-text">ToolBox</span><span class="logo-badge">PRO</span></a><nav aria-label="Main navigation"><a href="index.html" id="nav-tools">Tools</a><a href="about.html" id="nav-about">About</a><a href="contact.html" id="nav-contact">Contact</a><a href="privacy.html" id="nav-privacy">Privacy</a><button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-sun"></i></button></nav></div></header>

    <main id="main-content">

    <div class="tool-page">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <h1><i class="fas fa-qrcode" style="color:var(--accent-2)"></i> QR Code Generator</h1>
        <p class="tool-description">Create QR codes for any text, URL, or data. Enter your content below.</p>

        <div class="tool-input-group">
            <label>Enter text or URL</label>
            <input type="text" class="tool-input" id="qr-input" placeholder="https://example.com">
        </div>
        <button class="tool-btn btn-primary" onclick="generateQR()"><i class="fas fa-qrcode"></i> Generate QR Code</button>
        <div style="text-align:center;margin-top:1.5rem;">
            <div id="qr-output" style="background:white;display:inline-block;padding:1rem;border-radius:10px;"></div>
        </div>
    </div>
    </main>

    <footer><div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;"><p>© 2025 ToolBox Pro. All rights reserved.</p></div></footer>
    <button class="back-to-top" id="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    <div class="analytics-badge" id="analytics-badge"><span class="dot"></span><span class="analytics-count">0</span> views</div>
    <script src="components.js"></script>
    <script>
        function generateQR() {
            const text = document.getElementById('qr-input').value;
            if (!text) return;
            document.getElementById('qr-output').innerHTML = '<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(text) + '&bgcolor=ffffff&color=6c5ce7" alt="QR Code" style="border-radius:8px;">';
        }
    </script>
</body>
</html>
